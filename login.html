{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<h1>Admin login</h1>
{% if error %}<p class="flash error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="field">Username <input type="text" name="username" required autofocus></label>
  <label class="field">Password <input type="password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
